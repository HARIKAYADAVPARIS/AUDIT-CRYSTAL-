<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audit Crystal | AI Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-950 text-white p-10">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-4xl font-black mb-8 text-amber-500">AUDIT CRYSTAL</h1>
        
        <div class="bg-slate-900 p-8 rounded-2xl border border-slate-800 shadow-xl">
            <input type="file" id="pdfUpload" class="mb-4 block w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-amber-500 file:text-slate-950 hover:file:bg-amber-400">
            
            <button id="auditBtn" onclick="runAudit()" class="w-full py-4 bg-amber-500 text-slate-950 font-bold rounded-xl hover:bg-amber-400 transition-all">
                RUN DETERMINISTIC SCAN
            </button>
        </div>

        <div id="results" class="hidden mt-10 p-8 bg-slate-900 border-l-4 border-amber-500 rounded-r-2xl">
            <h3 class="text-amber-500 font-bold mb-4 uppercase tracking-widest">Intelligence Stream</h3>
            <p id="outputText" class="text-slate-200 leading-relaxed font-serif whitespace-pre-wrap"></p>
        </div>
    </div>

    <script>
        async function runAudit() {
            const btn = document.getElementById('auditBtn');
            const results = document.getElementById('results');
            const outputText = document.getElementById('outputText');

            btn.disabled = true;
            btn.innerText = "Processing Data...";

            try {
                const response = await fetch('/api/analyze', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: "Perform a high-level CSRD compliance audit on this report. Highlight 3 major financial risks." })
                });

                const data = await response.json();

                if (data.result) {
                    results.style.display = 'block';
                    outputText.innerText = data.result;
                    results.scrollIntoView({ behavior: 'smooth' });
                } else {
                    alert("Error: " + (data.error || "Unknown response structure"));
                }
            } catch (e) {
                alert("Critical Connection Error");
            } finally {
                btn.disabled = false;
                btn.innerText = "RUN DETERMINISTIC SCAN";
            }
        }
    </script>
</body>
</html>
